name: Manifest GitOps Sync

on:
  push:
    branches: [ "main" ]
    paths:
      - 'manifest/**'

jobs:
  sync-and-refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACTION_TOKEN }}

      # 1. 변경 사항 커밋 및 푸시 (자동 포맷팅 등이 필요할 경우 대비)
      - name: Commit and Push (if changed)
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "action@github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: sync manifests" && git push)

      # 2. ArgoCD Webhook 호출 (즉시 새로고침 트리거)
      - name: Trigger ArgoCD Refresh
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.ARGOCD_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://${{ secrets.ARGOCD_SERVER }}/api/v1/applications/${{ secrets.ARGOCD_APP_NAME }}/sync" \
            -d '{}'
